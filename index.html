<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/colfetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #4a0e2e;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        #container {
            background: #fffafa;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 320px;
            height: 520px;
            text-align: center;
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { 
            color: #8e1b54; 
            font-family: 'Pacifico', cursive;
            font-size: 22px; 
            margin: 10px 0;
            pointer-events: none;
        }

        /* The ID we will target with JS */
        #displayImg {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .buttons {
            width: 100%;
            height: 150px;
            position: relative;
            margin-top: 10px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: absolute;
            transition: transform 0.2s ease;
        }

        #yesBtn {
            background-color: #c9a050;
            color: white;
            left: 40px;
            top: 20px;
            z-index: 10;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
            left: 170px;
            top: 20px;
            transition: 0.15s ease;
        }
    </style>
</head>
<body>

    <div id="container">
        <h1 id="question">Will you be my girlfriend? ❤️</h1>
        
        <img id="displayImg" src="https://media.giphy.com/media/XYEEvoX0Ub69ZgN9ai/giphy.gif" alt="Pleading">

        <div class="buttons" id="buttonArea">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const buttonArea = document.getElementById('buttonArea');
        const question = document.getElementById('question');
        const img = document.getElementById('displayImg');

        // Function to make the No button jump away
        const moveButton = () => {
            const areaWidth = buttonArea.clientWidth;
            const areaHeight = buttonArea.clientHeight;
            
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const newLeft = Math.floor(Math.random() * (areaWidth - btnWidth));
            const newTop = Math.floor(Math.random() * (areaHeight - btnHeight));

            noBtn.style.left = `${newLeft}px`;
            noBtn.style.top = `${newTop}px`;
        };

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // When "Yes" is clicked
        yesBtn.addEventListener('click', () => {
            // Update text
            question.innerHTML = "I knew you'd say yes! 🥰✨";
            
            // Update the GIF to your requested one
            img.src = "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZTc2bXZ1YmxxaWt6N29zZnRheG5yZnptcnRvbWFuamxwMXFycndwdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/bznNJlqAi4pBC/giphy.gif";
            
            // Hide the No button
            noBtn.style.display = 'none';
            
            // Center the Yes button
            yesBtn.style.left = "50%";
            yesBtn.style.top = "20px";
            yesBtn.style.transform = "translateX(-50%)";
            
            // Trigger confetti
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#c9a050', '#8e1b54', '#ffffff']
            });
        });
    </script>
</body>
</html>
